<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102b45">
<title>Entrar — Estudo SME Pro</title>
<style>
:root{--n:#102b45;--b:#1c638f;--g:#f2b300;--bg:#f4f7fa;--c:#fff;--t:#172532;--m:#6b7d8b;--l:#dce5ec;--ok:#21865c;--bad:#c63d4b}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--t)}
button,input{font:inherit}
button{cursor:pointer}
.top{background:linear-gradient(135deg,#102b45,#1b5b84);color:#fff;box-shadow:0 4px 18px #102b4530}
.topin{max-width:520px;margin:auto;padding:16px;display:flex;gap:10px;align-items:center}
.logo{width:42px;height:42px;border:2px solid var(--g);border-radius:12px;display:grid;place-items:center;font-weight:900;color:var(--g)}
.topin b{display:block}
.topin small{opacity:.72}
.wrap{max-width:520px;margin:auto;padding:22px 16px 60px}
.tabs{display:flex;gap:8px;margin-top:18px}
.tabs button{flex:1;border:1px solid var(--l);background:#fff;border-radius:999px;padding:10px;color:var(--n);font-weight:700}
.tabs button.active{background:var(--n);color:#fff;border-color:var(--n)}
.card{background:var(--c);border:1px solid var(--l);border-radius:20px;padding:24px;box-shadow:0 8px 28px #102b4512;margin-top:14px}
.card h1{font-size:22px;margin:0 0 6px;color:var(--n)}
.card p{color:var(--m);line-height:1.55;margin:0 0 18px}
label{display:block;font-weight:700;font-size:13px;color:var(--n);margin-bottom:6px}
input{width:100%;padding:13px;border:1px solid var(--l);border-radius:12px;margin-bottom:16px;text-transform:none}
input:focus{outline:2px solid var(--b);border-color:transparent}
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:800;width:100%}
.primary{background:var(--n);color:#fff}
.primary:disabled{opacity:.6;cursor:default}
.notice{padding:13px 15px;border-radius:12px;margin-top:16px;line-height:1.55;display:none}
.notice.show{display:block}
.notice.success{background:#edf9f3;border:1px solid #bde4d0;color:#1c6b49}
.notice.error{background:#fff0f1;border:1px solid #f3c1c6;color:#a72f3c}
.notice.pending{background:#fff8df;border:1px solid #f0d273;color:#624f00}
.pane{display:none}
.pane.active{display:block}
.footlink{text-align:center;margin-top:18px;color:var(--m);font-size:14px}
.footlink a{color:var(--b);font-weight:700;text-decoration:none}
</style>
</head>
<body>

<header class="top"><div class="topin">
  <div class="logo">SME</div>
  <div><b>Estudo SME Pro</b><small>Área do candidato</small></div>
</div></header>

<main class="wrap">
  <div class="tabs">
    <button class="active" id="tabLogin" onclick="showPane('login')">Entrar</button>
    <button id="tabEstado" onclick="showPane('estado')">Consultar estado</button>
  </div>

  <div class="card pane active" id="paneLogin">
    <h1>Entrar</h1>
    <p>Usa o nome e o código de acesso que recebeste pelo WhatsApp.</p>
    <form id="formLogin">
      <label for="nomeLogin">Nome completo</label>
      <input id="nomeLogin" type="text" placeholder="Ex: Tomás Luciano" autocomplete="name" required>
      <label for="codigoLogin">Código de acesso</label>
      <input id="codigoLogin" type="text" placeholder="Código recebido pelo WhatsApp" autocomplete="one-time-code" required>
      <button class="btn primary" type="submit" id="btnLogin">Entrar</button>
    </form>
    <div class="notice" id="noticeLogin"></div>
  </div>

  <div class="card pane" id="paneEstado">
    <h1>Consultar estado</h1>
    <p>Introduz a referência que recebeste ao criar a conta para veres o estado do teu pedido.</p>
    <form id="formEstado">
      <label for="referencia">Referência</label>
      <input id="referencia" type="text" placeholder="Ex: SME-A1B2C3" required>
      <button class="btn primary" type="submit" id="btnEstado">Consultar</button>
    </form>
    <div class="notice" id="noticeEstado"></div>
  </div>

  <p class="footlink">Ainda não tens conta? <a href="cadastro.html">Criar conta</a></p>
</main>

<script>
const API_BASE = 'https://estudo-sme-pro-backend-1.onrender.com/api';

function showPane(name){
  document.getElementById('paneLogin').classList.toggle('active', name==='login');
  document.getElementById('paneEstado').classList.toggle('active', name==='estado');
  document.getElementById('tabLogin').classList.toggle('active', name==='login');
  document.getElementById('tabEstado').classList.toggle('active', name==='estado');
}

function setNotice(el, msg, type){
  el.textContent = msg;
  el.className = 'notice show ' + type;
}

document.getElementById('formLogin').addEventListener('submit', async (e) => {
  e.preventDefault();
  const nome = document.getElementById('nomeLogin').value.trim();
  const codigo = document.getElementById('codigoLogin').value.trim();
  const notice = document.getElementById('noticeLogin');
  const btn = document.getElementById('btnLogin');
  notice.className = 'notice';
  if (!nome || !codigo) { setNotice(notice, 'Preenche nome e código.', 'error'); return; }
  btn.disabled = true; btn.textContent = 'A entrar…';
  try {
    const res = await fetch(`${API_BASE}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nome, codigo })
    });
    const data = await res.json();
    if (!res.ok) {
      setNotice(notice, data.erro || 'Não foi possível entrar.', 'error');
      btn.disabled = false; btn.textContent = 'Entrar';
      return;
    }
    sessionStorage.setItem('candidato', JSON.stringify(data));
    setNotice(notice, `Bem-vindo, ${data.nome}! A abrir o teu painel de estudo…`, 'success');
    setTimeout(() => { window.location.href = 'index.html'; }, 900);
  } catch (err) {
    setNotice(notice, 'Não foi possível ligar ao servidor. Tenta novamente.', 'error');
    btn.disabled = false; btn.textContent = 'Entrar';
  }
});

document.getElementById('formEstado').addEventListener('submit', async (e) => {
  e.preventDefault();
  const referencia = document.getElementById('referencia').value.trim();
  const notice = document.getElementById('noticeEstado');
  const btn = document.getElementById('btnEstado');
  notice.className = 'notice';
  if (!referencia) { setNotice(notice, 'Indica a tua referência.', 'error'); return; }
  btn.disabled = true; btn.textContent = 'A consultar…';
  try {
    const res = await fetch(`${API_BASE}/candidatos/${encodeURIComponent(referencia)}`);
    const data = await res.json();
    btn.disabled = false; btn.textContent = 'Consultar';
    if (!res.ok) {
      setNotice(notice, data.erro || 'Referência não encontrada.', 'error');
      return;
    }
    const estados = {
      pendente: ['A tua candidatura está pendente. Confirma se já enviaste o comprovativo pelo WhatsApp para 999 999 999.', 'pending'],
      aprovado: ['A tua candidatura foi aprovada! O teu código de acesso já foi enviado pelo WhatsApp — usa-o para entrar.', 'success'],
      recusado: ['A tua candidatura foi recusada. Contacta a equipa pelo WhatsApp para mais informações.', 'error']
    };
    const [msg, type] = estados[data.status] || ['Estado desconhecido.', 'error'];
    setNotice(notice, msg, type);
  } catch (err) {
    setNotice(notice, 'Não foi possível ligar ao servidor. Tenta novamente.', 'error');
    btn.disabled = false; btn.textContent = 'Consultar';
  }
});
</script>
</body>
</html>
